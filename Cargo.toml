[package]
name = "rust_test"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
solana-program = "1.18"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1"
futures = "0.3"
tokio-stream = "0.1"
dotenv = "0.15"
bs58 = "0.5"

# Для WebSocket
tokio-tungstenite = "0.21"
tungstenite = "0.21"
url = "2"
